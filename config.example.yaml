# Default configuration for `see`.
#
# All fields are optional. Remove the leading `#` to enable a field.
# This file is materialised by `see` on first run when no
# configuration exists at the default path; until you uncomment and
# edit a field, every value below is treated as "not set" and `see`
# falls back to the current working directory and the embedded defaults.
#
# A configured `workflows` sequence enables named custom workflows. Each
# entry is required to have a unique name, prompt, condition, and commit
# template. Leave the whole section commented out to retain OpenSpec
# compatibility mode.
#
# Workflows run in order for each repository. Exit status 1 means that
# workflow has no work; other workflows are still evaluated.

# root_dir: "~/Dev"
# include:                 # relative to root_dir; empty means every immediate child
#   - "playground-*"
# exclude:                 # matched against each candidate's basename
#   - "bin"

# Lane isolation. "branch" (the default) runs the agent in the
# operator's checkout; "worktree" runs it in a git worktree so the
# operator's checkout is never switched. auto_merge and worktree_root
# are only meaningful with worktree: true and are rejected otherwise.
# worktree: false
# auto_merge: true                 # rebase + fast-forward merge on success (default)
# worktree_root: "~/.cache/see/worktrees"

# Log directory. SEE_LOG_DIR (when non-empty) overrides this field,
# which overrides the default below. Whitespace-only is treated as
# unset. ~ is expanded like the other path fields.
# log_dir: "~/.cache/see/logs"

# Custom workflows may also be direct Markdown files in workflows_dir.
# The filename is the workflow name, frontmatter supplies condition/commit/model,
# and the body is the prompt. The default directory is shown below.
# workflows_dir: "~/.config/see/workflows/"

# workflows:
#   - name: openspec
#     disable: false            # optional; true parks this workflow (still validated)
#     model: "openai/gpt-5-mini" # optional; otherwise use pi's default
#     prompt: |-
#       Apply the OpenSpec change "{change}".
#     condition: "git rev-parse --abbrev-ref HEAD"
#     commit: "see: apply {change}"
#     check: "openspec validate {change}"   # optional quality gate; absent or blank = no gate
