# Default configuration for `see`.
#
# All fields are optional. Remove the leading `#` to enable a field.
# This file is materialised by `see` on first run when no
# configuration exists at the default path; until you uncomment and
# edit a field, every value below is treated as "not set" and `see`
# falls back to the command-line inputs and the embedded defaults.
#
# A blank `condition` keeps `see` in OpenSpec compatibility mode:
# it discovers `openspec/changes/` directories, runs the agent on
# `see/<change>` branches, treats archival as completion, and uses
# the default commit message. Configuring `condition` switches `see`
# into custom workflow mode for every watched repository; that mode
# also requires a nonblank `commit` template (and a nonblank prompt
# from either this file or `--prompt`) or startup fails.

# watches:
#   - "~/Dev/*"

# prompt: |-
#   Apply the OpenSpec change "{change}".

# condition: ""      # platform-shell command; exit 0 means work, exit 1 means idle, any other nonzero is a failure

# commit: ""         # catch-up commit message template (custom workflow mode only); supports {change}
