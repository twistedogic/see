name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: fmt, lint, test, build
        run: task
      - name: verify formatting
        # `task` runs `go fmt` (in-place); fail CI if it changed anything,
        # since that means a file was not committed formatted.
        run: git diff --exit-code
